[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kids-search-agent"
version = "0.2.0"
description = "Korean sample content search with Qwen embeddings and BGE reranking"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3", "numpy>=1.26,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
ui-test = ["playwright>=1.50,<2"]
models = ["torch>=2.6,<3", "transformers>=4.51,<5", "accelerate>=1,<2", "sentencepiece>=0.2,<1"]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.setuptools.packages.find]
include = ["search_agent*"]

[tool.setuptools.package-data]
search_agent = ["static/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
