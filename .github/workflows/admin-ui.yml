name: Admin UI (mock; no real model inference)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Admin and public search browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SEARCH_MODE: mock
      SEARCH_BACKEND: sample
      # Disposable CI fixture only. Never use this key in a deployed service.
      SEARCH_ADMIN_API_KEY: ci-only-admin-browser-key-never-use-in-production
      PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,ui-test]'
      - name: Lint and type checks
        run: |
          python -m ruff check search_agent scripts tests
          python -m ruff format --check search_agent scripts tests
          python -m mypy search_agent scripts
      - name: Check runner browser
        run: "$PLAYWRIGHT_CHROMIUM_EXECUTABLE --version"
      - name: Exercise administrator and public search screens
        run: |
          python -m uvicorn search_agent.app:app --host 127.0.0.1 --port 8000 > /tmp/admin-smoke-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/admin-smoke-server.log
              exit 1
            fi
            sleep 0.5
          done
          if [ "$ready" != true ]; then
            cat /tmp/admin-smoke-server.log
            exit 1
          fi
          python scripts/smoke_admin.py --screenshots-dir artifacts/admin-ui
          python scripts/smoke_ui.py
      - name: Save administrator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-screenshots
          path: artifacts/admin-ui
          if-no-files-found: ignore
          retention-days: 7
      - name: Report validation scope
        if: always()
        run: echo 'Browser tests use the sample/mock server. No real Qwen/BGE inference or production data writes. Live OpenSearch admin API tests run separately with synthetic model fixtures.' >> "$GITHUB_STEP_SUMMARY"
