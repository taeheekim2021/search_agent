name: CI (no real model inference)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (model test doubles)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENSEARCH_TEST: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q --ignore=tests/test_opensearch_integration.py
      - name: Report validation scope
        if: always()
        run: echo 'Unit/contract tests use test doubles. Real Qwen/BGE inference, ranking quality and model latency are NOT validated.' >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: OpenSearch 2.19.3 (synthetic fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      opensearch:
        image: opensearchproject/opensearch:2.19.3
        env:
          discovery.type: single-node
          node.store.allow_mmap: "false"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          DISABLE_SECURITY_PLUGIN: "true"
        ports:
          - 127.0.0.1:9200:9200
        options: >-
          --health-cmd "curl --fail --silent http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      OPENSEARCH_TEST: "1"
      OPENSEARCH_URL: http://127.0.0.1:9200
      # HTTP is only for this disposable, loopback-bound CI service.
      OPENSEARCH_ALLOW_HTTP_LOCAL: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_opensearch_integration.py
      - name: Report validation scope
        if: always()
        run: echo 'Live OpenSearch uses synthetic vectors/metadata only. Real Qwen/BGE inference, ranking quality, model latency and real media acquisition are NOT validated.' >> "$GITHUB_STEP_SUMMARY"
